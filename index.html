<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moonbase Yajie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a full-bleed 3D diorama (a chunk of moon floating in space) with white operations cards floating over it,
   in the style of a logistics control room. Phones: the scene on top, the cards flow below it. */
:root {
  color-scheme: light;
  --space: #0b1020;
  --card: #ffffff;
  --ink: #141a2e;
  --muted: #6b7390;
  --line: #e7e9f1;
  --soft: #f4f6fb;
  --blue: #3461f5;
  --claude: #d97757;
  --github: #24292f;
  --pr: #7c5cff;
  --cardboard: #d4a26b;
  --ok: #17a36b;
  --ok-bg: #e6f7ef;
  --warn: #c98a00;
  --warn-bg: #fdf3dc;
  --font-ui: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --shadow: 0 10px 34px rgba(8, 14, 40, .22), 0 1px 2px rgba(8, 14, 40, .08);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--space); color: var(--ink); font-family: var(--font-ui); font-size: 13px; overflow: hidden; }
.app { position: relative; height: 100%; }
.scene { position: absolute; inset: 0; }
.scene canvas { display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.tag { font: 600 11px var(--font-ui); background: #ffffffeb; color: var(--ink); padding: 4px 9px 4px 7px; border-radius: 999px; box-shadow: 0 4px 14px rgba(8,14,40,.25); display: flex; align-items: center; gap: 6px; white-space: nowrap; transition: transform .15s; }
.tag i { width: 8px; height: 8px; border-radius: 3px; }
.tag.sel { outline: 2px solid var(--blue); }

.hud { position: absolute; inset: 0; z-index: 1; pointer-events: none; padding: 14px 16px; display: grid; gap: 14px;
  grid-template-columns: minmax(0, 1fr) 350px; grid-template-rows: auto auto minmax(0, 1fr) auto; }
.card { pointer-events: auto; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 10px 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.01em; margin-right: auto; }
.brand svg { width: 30px; height: 30px; }
.chip { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px 6px 6px; }
.chip .code { font: 600 11px var(--font-code); color: #fff; background: var(--blue); border-radius: 8px; padding: 6px 7px; }
.chip b { display: block; font-size: 13px; }
.chip small { color: var(--muted); font-size: 11px; }
.live { display: flex; align-items: center; gap: 8px; background: var(--ok-bg); color: var(--ok); font-weight: 700; border-radius: 999px; padding: 7px 12px; font-size: 12px; }
.live.off { background: var(--soft); color: var(--muted); }
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.live:not(.off) .dot { animation: beat 1.8s infinite; }
@keyframes beat { 50% { box-shadow: 0 0 0 5px #17a36b2a; } }
.live time { color: var(--ink); font-variant-numeric: tabular-nums; }
.me { display: flex; align-items: center; gap: 10px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--blue), var(--pr)); }
.me b { display: block; font-size: 13px; }
.me small { color: var(--muted); font-size: 11px; }

.kpis { grid-column: 1; grid-row: 2; display: flex; gap: 12px; flex-wrap: wrap; align-self: start; }
.kpi { display: flex; gap: 12px; align-items: center; padding: 12px 18px 12px 12px; min-width: 200px; }
.kpi .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: #eef2ff; color: var(--blue); }
.kpi .ic svg { width: 22px; height: 22px; }
.kpi .k { color: var(--muted); font-size: 12px; font-weight: 600; }
.kpi .v { font-size: 24px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .s { color: var(--muted); font-size: 11px; }
.up { color: var(--ok); font-weight: 700; }

.mapctl { grid-column: 1; grid-row: 2 / 4; justify-self: end; align-self: start; display: flex; flex-direction: column; padding: 6px; gap: 2px; border-radius: 12px; }
.mapctl button { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 8px; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.mapctl button:hover { background: var(--soft); }
.mapctl svg { width: 18px; height: 18px; }
.mapctl hr { border: 0; border-top: 1px solid var(--line); margin: 3px 6px; }

.station { grid-column: 2; grid-row: 2 / 4; align-self: start; padding: 16px; display: grid; gap: 14px; max-height: 100%; overflow: auto; }
.st-head { display: flex; gap: 12px; align-items: center; }
.st-icon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.st-icon svg { width: 30px; height: 30px; }
.eyebrow { font: 700 10.5px var(--font-ui); letter-spacing: .1em; color: var(--blue); }
.st-head h2 { margin: 1px 0; font-size: 17px; letter-spacing: -.01em; }
.st-head p { margin: 0; color: var(--muted); font-size: 12px; }
.st-status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.pill { font-weight: 700; font-size: 11.5px; border-radius: 8px; padding: 5px 10px; background: var(--ok-bg); color: var(--ok); white-space: nowrap; }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.blue { background: #eef2ff; color: var(--blue); }
.pill.grey { background: var(--soft); color: var(--muted); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--soft); border-radius: 12px; padding: 10px 12px; }
.tile .k { color: var(--muted); font-size: 11px; font-weight: 600; }
.tile .v { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile .bar { height: 4px; background: var(--line); border-radius: 4px; margin-top: 6px; overflow: hidden; }
.tile .bar i { display: block; height: 100%; background: var(--blue); border-radius: 4px; }
.sec { display: flex; justify-content: space-between; font-weight: 700; font-size: 12.5px; }
.sec span { color: var(--muted); font-weight: 500; }
.mini { list-style: none; margin: -6px 0 0; padding: 0; }
.mini li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mini li:last-child { border-bottom: 0; }
.mini .box { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: #f6ead9; }
.mini .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.mini .w { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

.tracking { grid-column: 1; grid-row: 4; align-self: end; max-width: 820px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: center; }
.tr-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.tr-head h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.tr-head span { color: var(--muted); font: 500 11px var(--font-code); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); position: relative; }
.step { display: grid; justify-items: center; gap: 6px; text-align: center; position: relative; }
.step::before { content: ""; position: absolute; top: 16px; right: 50%; width: 100%; height: 3px; background: var(--line); z-index: 0; }
.step:first-child::before { display: none; }
.step.done::before, .step.now::before { background: var(--blue); }
.step .c { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--muted); z-index: 1; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.step.done .c { background: var(--blue); color: #fff; box-shadow: none; }
.step.now .c { background: #fff; color: var(--blue); box-shadow: 0 0 0 3px var(--blue); }
.step .c svg { width: 15px; height: 15px; }
.step b { font-size: 12px; }
.step small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.shipcard { background: var(--soft); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: center; }
.shipcard .art { width: 54px; height: 54px; border-radius: 12px; background: #fff; display: grid; place-items: center; }
.shipcard b { display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shipcard p { margin: 2px 0 6px; color: var(--muted); font-size: 12px; }
.shipcard .eta { color: var(--muted); font-size: 11.5px; margin-left: 6px; font-variant-numeric: tabular-nums; }

.feed { grid-column: 2; grid-row: 4; align-self: end; padding: 12px 14px 12px; display: grid; gap: 8px; max-height: 300px; min-height: 0; grid-template-rows: auto minmax(0, 1fr) auto; }
.tabs { display: flex; gap: 4px; align-items: center; }
.tabs b { background: var(--soft); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; }
.tabs span { margin-left: auto; color: var(--muted); font-size: 11.5px; }
.log { list-style: none; margin: 0; padding: 0; overflow: auto; min-height: 60px; }
.log li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.log li.fresh { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: #eef2ff; } }
.log .d { width: 9px; height: 9px; border-radius: 50%; }
.log .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.log .a { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.log .meta { grid-column: 2 / -1; color: var(--muted); font-size: 11px; margin-top: -3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { color: var(--muted); padding: 10px 2px; line-height: 1.5; }
.sim { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.sim > span { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.btns button { font: 600 12px var(--font-ui); border-radius: 10px; padding: 7px 8px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btns button i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.btns button:hover { background: var(--soft); }
.step.fail .c { background: #e5484d; color: #fff; box-shadow: none; }
.step.fail b { color: #e5484d; }
.step.fail::before { background: #e5484d; }
.pill.red { background: #fdecec; color: #d93036; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; color: #c9cfe6; padding: 24px; text-align: center; }

@media (max-width: 1100px) { .hud { grid-template-columns: minmax(0, 1fr) 310px; } .kpi { min-width: 0; } .tracking { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  body { overflow: auto; }
  .app { height: auto; }
  .scene { position: relative; height: 62vh; min-height: 360px; }
  .hud { position: static; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; padding: 16px; }
  .hud > * { grid-column: 1 !important; grid-row: auto !important; max-width: none; }
  .topbar { order: -2; } .mapctl { display: none; }
  .station { max-height: none; }
  .feed { max-height: 420px; }
  .chip, .me small { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="scene" id="scene" aria-label="3D moon base: your habitat, the build factory, the GitHub and Claude warehouses, and empty build sites"></div>
  <div class="hud">
    <header class="topbar card">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 28 9v14l-12 7L4 23V9z" fill="#3461f5"/><path d="M16 2 28 9l-12 7L4 9z" fill="#6f8dff"/><path d="M16 16v14l12-7V9z" fill="#2347c9"/><circle cx="20" cy="10.5" r="2.2" fill="#fff" opacity=".9"/></svg>
        Moonbase
      </div>
      <div class="chip"><span class="code">MB-01</span><span><b>Moonbase Yajie</b><small>Sea of Tranquility · 4 stations · 2 build sites</small></span></div>
      <div class="live off" id="live"><span class="dot"></span><span id="statusText">Connecting</span><time id="clock"></time></div>
      <div class="me"><span class="avatar">CY</span><span><b>Yajie</b><small>Base commander</small></span></div>
    </header>

    <section class="kpis">
      <div class="kpi card"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg></span>
        <span><div class="k">Shipments today</div><div class="v" id="kToday">0</div><div class="s" id="kTodayS">crates moved</div></span></div>
      <div class="kpi card"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-6 3-11 5.5"/></svg></span>
        <span><div class="k">Commits logged</div><div class="v" id="kCommits">0</div><div class="s" id="kCommitsS">to the GitHub warehouse</div></span></div>
      <div class="kpi card"><span class="ic" style="background:#fbeee8;color:var(--claude)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v6M12 15v6M3 12h6M15 12h6M5.6 5.6l4.2 4.2M14.2 14.2l4.2 4.2M18.4 5.6l-4.2 4.2M9.8 14.2l-4.2 4.2"/></svg></span>
        <span><div class="k">Claude runs</div><div class="v" id="kClaude">0</div><div class="s" id="kClaudeS">from the Claude warehouse</div></span></div>
    </section>

    <div class="mapctl card" role="toolbar" aria-label="Camera">
      <button id="zIn" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zOut" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <hr>
      <button id="rL" aria-label="Rotate left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4v5h5"/><path d="M5 9a8 8 0 1 1-1 5"/></svg></button>
      <button id="rR" aria-label="Rotate right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 4v5h-5"/><path d="M19 9a8 8 0 1 0 1 5"/></svg></button>
      <button id="home" aria-label="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg></button>
    </div>

    <aside class="station card" id="station" aria-live="polite"></aside>

    <section class="tracking card" id="tracking"></section>

    <section class="feed card">
      <div class="tabs"><b>Cargo log</b><span id="logCount"></span></div>
      <ul class="log" id="log"></ul>
      <div class="sim"><span>Simulate</span>
        <div class="btns" id="sim">
          <button data-type="push"><i style="background:#3461f5"></i>Push</button>
          <button data-type="pull"><i style="background:#17b3a3"></i>Pull</button>
          <button data-type="pr"><i style="background:#7c5cff"></i>Open PR</button>
          <button data-type="merge"><i style="background:#17a36b"></i>Merge PR</button>
          <button data-type="claude"><i style="background:#d97757"></i>Claude run</button>
          <button data-type="fail"><i style="background:#e5484d"></i>Failed build</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------- live feed config ----------
// Set FEED_URL to the backend's Server-Sent Events stream once it exists.
// Each message is JSON: { id, type: "push"|"pull"|"pr"|"merge"|"claude"|"fail", title, repo, branch?, sha?, at }
const FEED_URL = '';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;

// ---------- the base ----------
const ISLAND = 58;
const ST = {
  you:     { x: -30, z: 12,  r: 9,  color: 0x3461f5, css: '#3461f5', eyebrow: 'HABITAT · HB-01',   name: "Yajie's Habitat",  sub: 'Where every commit starts' },
  factory: { x: -2,  z: -6,  r: 12, color: 0xf2a93b, css: '#e39a22', eyebrow: 'FACTORY · FX-01',   name: 'Build Factory',    sub: 'Builds and checks every crate' },
  github:  { x: 28,  z: -22, r: 10, color: 0x24292f, css: '#24292f', eyebrow: 'WAREHOUSE · WH-GH', name: 'GitHub Warehouse', sub: 'github.com/crlsyajie' },
  claude:  { x: 26,  z: 22,  r: 10, color: 0xd97757, css: '#d97757', eyebrow: 'WAREHOUSE · WH-CL', name: 'Claude Warehouse', sub: 'Claude Code sessions' },
  site1:   { x: -8,  z: 35,  r: 7,  color: 0x9aa1b8, css: '#9aa1b8', eyebrow: 'BUILD SITE · BS-01', name: 'Empty Build Site', sub: 'Room for the next station', site: true },
  site2:   { x: -27, z: -30, r: 7,  color: 0x9aa1b8, css: '#9aa1b8', eyebrow: 'BUILD SITE · BS-02', name: 'Empty Build Site', sub: 'Room for the next station', site: true },
};
const ROADS = [['you', 'factory'], ['factory', 'github'], ['factory', 'claude'], ['factory', 'site1'], ['factory', 'site2']];
// Each git scenario: the stations its crate visits, and what each stop means.
const ROUTES = {
  commit: ['you', 'factory', 'github'], push: ['you', 'factory', 'github'], pull: ['github', 'factory', 'you'],
  pr: ['you', 'factory', 'github'], merge: ['github', 'factory', 'github'], claude: ['claude', 'factory', 'you'], fail: ['you', 'factory', 'you'],
};
const STEPS = {
  commit: ['Committed', 'Built at factory', 'Stored on GitHub'],
  push:   ['Pushed', 'Built at factory', 'Stored on GitHub'],
  pull:   ['Fetched from GitHub', 'Unpacked at factory', 'Delivered to you'],
  pr:     ['PR opened', 'Checks run', 'Awaiting review'],
  merge:  ['Merge started', 'Checks passed', 'Merged into main'],
  claude: ['Claude run', 'Built at factory', 'Delivered to you'],
  fail:   ['Pushed', 'Build failed', 'Returned to you'],
};
const EV_COLOR = { commit: '#3461f5', push: '#3461f5', pull: '#17b3a3', pr: '#7c5cff', merge: '#17a36b', claude: '#d97757', fail: '#e5484d' };
const TYPE_LABEL = { commit: 'Commit', push: 'Push', pull: 'Pull', pr: 'Pull request', merge: 'Merge', claude: 'Claude run', fail: 'Failed build' };
const routeOf = ev => ROUTES[ev.type] || ROUTES.commit;

// ---------- noise & terrain ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) { const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi, u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }

  $('kCommits').textContent = real.filter(e => ['commit', 'push', 'merge'].includes(e.type)).length;
  $('kClaude').textContent = real.filter(e => e.type === 'claude').length;
  $('logCount').textContent = real.length ? real.length + ' logged' : 'test mode';
}
function renderAll(fresh) { renderLog(fresh); renderStation(); renderTracking(); }
renderAll();
setInterval(() => { renderTracking(); renderStation(); }, 400);
setInterval(() => renderLog(), 60000);
const tick = () => { $('clock').textContent = hhmm(Date.now()); }; tick(); setInterval(tick, 10000);

function add(ev, animate = true) { if (events.some(x => x.id === ev.id)) return; events.unshift(ev); events.sort((a, b) => String(b.at).localeCompare(String(a.at))); if (animate) ship(ev); renderAll(new Set([ev.id])); }
// Simulated git scenarios with realistic details (marked as tests, never counted in totals).
const pick = a => a[Math.floor(Math.random() * a.length)];
const sha = () => Array.from({ length: 40 }, () => '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('');
let prNo = 12;
const SIM = {
  push:   () => ({ title: pick(['Tune crater shading', 'Fix rover wheel spin', 'Add dust trails to rovers', 'Wire up the cargo log']), branch: 'main' }),
  pull:   () => ({ title: `Pull origin/main · ${2 + Math.floor(Math.random() * 5)} new commits`, branch: 'main' }),
  pr:     () => ({ title: `PR #${++prNo} · ${pick(['Add a Vercel station', 'Rover pathing on curves', 'Night mode for the base'])}`, branch: pick(['feat/vercel-station', 'feat/curved-roads', 'feat/night-mode']) }),
  merge:  () => ({ title: `Merge PR #${prNo} into main`, branch: 'main' }),
  claude: () => ({ title: pick(['Write the Worker backend', 'Refactor the feed parser', 'Review the rover pathing']), branch: 'claude/session' }),
  fail:   () => ({ title: `Build failed · ${pick(['TypeError in rover.js', 'Lint: unused variable in feed.js', 'Test failed: crate stack overflow'])}`, branch: pick(['main', 'feat/curved-roads']) }),
};
function local(type) {
  const d = SIM[type]();
  add({ id: 'test-' + Date.now(), type, title: d.title, repo: type === 'claude' ? 'Claude Code' : 'CYF-Moonbase', branch: d.branch, sha: type === 'claude' ? undefined : sha(), at: new Date().toISOString(), local: true });
}
document.querySelectorAll('#sim button').forEach(b => { b.onclick = () => local(b.dataset.type); });

// live feed
const live = $('live'), st = $('statusText');
if (!FEED_URL || !window.EventSource) {
  st.textContent = 'Test mode';
  setTimeout(() => local('push'), 900); // one demo rover so the base is alive on arrival
} else {
  const es = new EventSource(FEED_URL);
  es.addEventListener('history', e => { const list = JSON.parse(e.data); events = [...events.filter(x => x.local), ...list].sort((a, b) => String(b.at).localeCompare(String(a.at))); if (list[0]) ship(list[0]); renderAll(); });
  es.onmessage = e => add(JSON.parse(e.data));
  es.onopen = () => { live.classList.remove('off'); st.textContent = 'Live'; };
  es.onerror = () => { live.classList.add('off'); st.textContent = 'Reconnecting'; };
}
</script>
